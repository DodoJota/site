<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quinta dos Gatos - Provas de Vinho Exclusivas">
    <title>Quinta dos Gatos - Provas de Vinho</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <!-- Cabeçalho -->
    <nav class="navbar navbar-expand-lg custom-navbar fixed-top">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='images/logo.png') }}" width="70" height="30" class="d-inline-block align-top" alt="Logo Quinta dos Gatos" loading="lazy">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="{{ url_for('home') }}#servicos">Provas de Vinho</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}#alojamento">Alojamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}#sobre">A Quinta</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}#testemunhos">Testemunhos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}#contato">Contatos</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Banner com Vídeo -->
    <div class="banner">
        <video autoplay muted loop id="video-background" class="video-background">
            <source src="{{ url_for('static', filename='video/wine.mp4') }}" type="video/mp4">
            Seu navegador não suporta vídeos HTML5.
        </video>
        <div class="banner-content animate__animated animate__fadeInUp">
            <h2 class="display-4 text-white">Explore Nossos Vinhos</h2>
            <h1 class="display-4 text-white">Uma Jornada de Sabores!</h1>
            <a href="https://www.booking.com/hotel/pt/quinta-picouto-de-cima.html" class="btn btn-light mt-3" target="_blank" rel="noopener noreferrer">
                Reserve
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
